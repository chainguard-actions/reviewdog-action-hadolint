name: Test hadolint_ignore input to suppress specific rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'tests/fixtures/ignore/Dockerfile'
          hadolint_ignore: 'DL3006 DL3008 DL3009 DL3015'
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed with ignored rules
        run: |
          echo "Action completed with hadolint_ignore suppressing known rules"
          echo "PASS"
