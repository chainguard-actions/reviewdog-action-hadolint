name: Test hadolint_ignore input to suppress specific rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile with known lint issues
        run: |
          mkdir -p tests/fixtures/ignore
          cat > tests/fixtures/ignore/Dockerfile <<'EOF'
          FROM ubuntu
          RUN apt-get install -y jq
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add tests/fixtures/ignore/Dockerfile
          git commit -m "Add Dockerfile fixture for ignore rules test"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: '*Dockerfile*'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          # DL3006: Always tag the version of an image explicitly
          # DL3008: Pin versions in apt-get install
          hadolint_ignore: DL3006 DL3008

      - name: Assert action completed with ignored rules
        run: |
          echo "Action completed with ignored rules DL3006 and DL3008"
          echo "PASS"
