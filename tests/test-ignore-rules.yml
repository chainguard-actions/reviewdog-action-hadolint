name: Test hadolint_ignore input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile with known lint issues
        run: |
          # Create a Dockerfile with DL3006 (no tag) and DL3009 (no apt-get clean) issues
          cat > "$GITHUB_WORKSPACE/Dockerfile.ignore" <<'EOF'
          FROM ubuntu
          RUN apt-get install -y jq
          EOF
          git add Dockerfile.ignore

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'Dockerfile.ignore'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'none'
          hadolint_ignore: 'DL3006 DL3008 DL3009'

      - name: Assert action completed with ignored rules
        run: |
          echo "Action completed with DL3006, DL3008, DL3009 ignored"
          echo "PASS: hadolint ran with ignore rules applied"
