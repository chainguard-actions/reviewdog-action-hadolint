name: Test fail_level none does not fail on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          include: '*Dockerfile.actbad*'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          tool_name: hadolint-act-test
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with fail_level none"
            exit 1
          fi
          echo "PASS"
