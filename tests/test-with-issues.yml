name: Test with Dockerfile that has lint issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile with known lint issues
        run: |
          # Create a Dockerfile with known hadolint issues:
          # DL3006: Always tag the version of an image explicitly
          # DL3009: Delete the apt-get lists after installing something
          cat > "$GITHUB_WORKSPACE/Dockerfile.issues" <<'EOF'
          FROM ubuntu
          RUN apt-get install -y jq
          EOF
          git add Dockerfile.issues

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'Dockerfile.issues'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'none'

      - name: Assert action completed (issues found but fail_level=none)
        run: |
          echo "Action completed - hadolint found issues but fail_level=none so exit code is 0"
          echo "PASS: action ran and reported issues without failing"
