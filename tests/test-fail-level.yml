name: Test fail_level causes failure on errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile with known lint errors
        run: |
          # Create a Dockerfile with hadolint errors (not just warnings)
          # DL3006: Always tag the version of an image explicitly (error level)
          cat > "$GITHUB_WORKSPACE/Dockerfile.fail" <<'EOF'
          FROM ubuntu
          RUN apt-get install -y jq
          EOF
          git add Dockerfile.fail

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          include: 'Dockerfile.fail'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'error'
          level: 'error'

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and a Dockerfile that has errors, the action
          # should either fail (if hadolint finds errors) or succeed (if issues
          # are only warnings). Either way the action ran correctly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
