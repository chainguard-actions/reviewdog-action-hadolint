name: Test fail_level causes non-zero exit on errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile with known errors
        run: |
          mkdir -p tests/fixtures/fail-level
          cat > tests/fixtures/fail-level/Dockerfile <<'EOF'
          FROM ubuntu
          RUN apt-get install -y curl
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add tests/fixtures/fail-level/Dockerfile
          git commit -m "Add Dockerfile with errors for fail_level testing"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          include: 'tests/fixtures/fail-level/Dockerfile'
          reporter: local
          filter_mode: nofilter
          # fail_level=warning means exit 1 if any warning or error found
          fail_level: warning
          level: warning

      - name: Assert action failed due to fail_level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_level=warning and a Dockerfile with issues, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed due to fail_level=warning"
