name: Test fail_level causes non-zero exit when issues found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile with lint errors
        run: |
          mkdir -p tests/fixtures/fail-level
          cat > tests/fixtures/fail-level/Dockerfile <<'EOF'
          FROM ubuntu
          RUN apt-get install -y jq
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add tests/fixtures/fail-level/Dockerfile
          git commit -m "Add Dockerfile fixture for fail-level test"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          include: '*Dockerfile*'
          reporter: local
          filter_mode: nofilter
          fail_level: warning
          level: warning

      - name: Assert action failed due to lint issues
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_level=warning and lint issues present, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when lint issues found with fail_level=warning"
