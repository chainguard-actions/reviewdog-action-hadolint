name: Test include/exclude file filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run hadolint with include filter targeting Dockerfiles
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          # Include only files matching the Dockerfile pattern
          include: '*Dockerfile*'
          # Exclude the testdata sub-dir to test exclude functionality
          exclude: testdata/sub-dir
          # Ignore all known issues
          hadolint_ignore: DL3006 DL3008 DL3009 DL3015 DL3059 SC2006
          fail_level: none
      - name: Assert action completed with include filter
        run: |
          echo "Action completed with include/exclude filter"
          echo "PASS"
