name: Test custom tool_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'tests/fixtures/tool-name/Dockerfile'
          tool_name: 'my-custom-hadolint'
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed with custom tool name
        run: |
          echo "Action completed with custom tool_name=my-custom-hadolint"
          echo "PASS"
