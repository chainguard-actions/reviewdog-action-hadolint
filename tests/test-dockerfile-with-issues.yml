name: Test Dockerfile with hadolint issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'tests/fixtures/issues/Dockerfile'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning

      - name: Assert action completed (issues found but fail_level=none)
        run: |
          echo "Action completed successfully with fail_level=none even when issues exist"
          echo "PASS"
