name: Test hadolint_ignore input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile with DL3006 and DL3008 issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-ignore"
          cat > "$GITHUB_WORKSPACE/test-ignore/Dockerfile" << 'EOF'
          FROM ubuntu
          RUN apt-get install -y curl
          EOF
          git add "$GITHUB_WORKSPACE/test-ignore/Dockerfile"

      - name: Run hadolint action ignoring specific rules
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'test-ignore/Dockerfile'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'error'
          level: 'error'
          hadolint_ignore: 'DL3006 DL3008 DL3009 DL3015'

      - name: Assert action succeeded with ignored rules
        run: |
          echo "Action completed - rules DL3006 DL3008 DL3009 DL3015 were ignored"
          echo "PASS"
