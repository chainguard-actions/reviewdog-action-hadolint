name: Test basic usage with clean Dockerfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'tests/fixtures/clean/Dockerfile'
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully
        run: |
          echo "Action completed with no errors on clean Dockerfile"
          echo "PASS"
