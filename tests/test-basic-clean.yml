name: Test basic usage with clean Dockerfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Dockerfile for testing
        run: |
          mkdir -p tests/fixtures/clean
          cat > tests/fixtures/clean/Dockerfile <<'EOF'
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y --no-install-recommends curl \
              && rm -rf /var/lib/apt/lists/*
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add tests/fixtures/clean/Dockerfile
          git commit -m "Add clean Dockerfile for testing"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'tests/fixtures/clean/Dockerfile'
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with exit code 0"
          echo "PASS"
