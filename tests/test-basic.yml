name: Test basic usage - run hadolint with local reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake curl and wget to avoid internet downloads
        run: |
          FAKE_BIN="$HOME/.fake-bin"
          mkdir -p "$FAKE_BIN"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" "$FAKE_BIN/curl"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-wget" "$FAKE_BIN/wget"
          chmod +x "$FAKE_BIN/curl" "$FAKE_BIN/wget"
          echo "$FAKE_BIN" >> "$GITHUB_PATH"

      - name: Run hadolint action with local reporter
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'none'
          level: 'warning'

      - name: Assert action completed successfully
        run: |
          echo "PASS: hadolint action ran successfully with local reporter"
