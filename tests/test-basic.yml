name: Test basic hadolint run (clean Dockerfile)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: dummy-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Dockerfile
        run: |
          cat > "$GITHUB_WORKSPACE/Dockerfile" <<'EOF'
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y --no-install-recommends curl \
              && rm -rf /var/lib/apt/lists/*
          EOF
          git add Dockerfile
          git config user.email "test@test.com"
          git config user.name "Test"
          git commit -m "add Dockerfile"

      - id: action
        uses: .
        with:
          github_token: dummy-token
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning

      - name: Assert action completed successfully
        run: |
          echo "Action completed with exit code: $?"
          echo "PASS: hadolint ran without fatal error"
