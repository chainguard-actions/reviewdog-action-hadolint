name: Test basic usage - clean Dockerfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Dockerfile for testing
        run: |
          cat > "$GITHUB_WORKSPACE/Dockerfile.test" <<'EOF'
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y --no-install-recommends jq=1.6-2.1ubuntu3 \
              && rm -rf /var/lib/apt/lists/*
          EOF
          git add Dockerfile.test

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'Dockerfile.test'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'none'

      - name: Assert action completed successfully
        run: |
          echo "Action completed with exit code 0"
          echo "PASS: hadolint ran successfully on clean Dockerfile"
