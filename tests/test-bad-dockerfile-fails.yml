name: Test bad Dockerfile fails with fail_level error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          include: '*Dockerfile.actbad*'
          reporter: local
          filter_mode: nofilter
          fail_level: error
      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on Dockerfile with error-level violations"
            exit 1
          fi
          echo "PASS"
