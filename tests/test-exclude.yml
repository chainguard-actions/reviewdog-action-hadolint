name: Test exclude input skips specified paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfiles for exclude testing
        run: |
          mkdir -p tests/fixtures/exclude/included
          mkdir -p tests/fixtures/exclude/excluded
          # This Dockerfile has issues but will be excluded
          cat > tests/fixtures/exclude/excluded/Dockerfile <<'EOF'
          FROM ubuntu
          RUN apt-get install -y curl
          EOF
          # This Dockerfile is clean and will be included
          cat > tests/fixtures/exclude/included/Dockerfile <<'EOF'
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y --no-install-recommends curl \
              && rm -rf /var/lib/apt/lists/*
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add tests/fixtures/exclude/
          git commit -m "Add Dockerfiles for exclude testing"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          include: 'tests/fixtures/exclude/**/Dockerfile'
          exclude: 'tests/fixtures/exclude/excluded/Dockerfile'
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed with exclude
        run: |
          echo "Action completed with exclude path — excluded Dockerfile skipped"
          echo "PASS"
